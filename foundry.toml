[profile.default]
src = 'contracts'
out = 'out'
libs = [
    'node_modules',
    'lib/arbitrum-sdk',
    'lib/forge-std',
    'lib/nitro-contracts',
]
remappings = [
    "@arbitrum/=node_modules/@arbitrum/",
    "@offchainlabs/=node_modules/@offchainlabs/",
    "@openzeppelin/=node_modules/@openzeppelin/",
    "ds-test/=lib/forge-std/lib/ds-test/src/",
    "eth-gas-reporter/=node_modules/eth-gas-reporter/",
    "forge-std/=lib/forge-std/src/",
    "hardhat/=node_modules/hardhat/",
    "solady/=node_modules/solady/src",
    "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "espresso-tee-contracts/=lib/nitro-contracts/lib/espresso-tee-contracts/src/",
]
test = 'test'
cache_path = 'cache_forge'
solc_version = '0.8.25'
optimizer = true
optimizer_runs = 2000
via_ir = true
fs_permissions = [
    { access = "read", path = "node_modules/@offchainlabs/" },
    { access = "read", path = "node_modules/@arbitrum/" },
    { access = "read", path = "node_modules/@openzeppelin/" },
    { access = "read-write", path = "./scripts/foundry" },
    { access = "read", path = "./migration/2.1.0" },
    { access = "read", path = "./migration/2.1.3" },
    { access = "read", path = "./migration/espresso-2.1.0/" },
    { access = "read", path = "./migration/espresso-2.1.3" },
    { access = "read", path = "./contracts/parent-chain/espresso-migration/" },
]
script = 'scripts'
evm_version = 'cancun'

[profile.v3]
src = 'contracts'
out = 'out_v3'
libs = [
    'node_modules',
    'lib/arbitrum-sdk',
    'lib/forge-std',
    'lib/nitro-contracts-v3',
]
remappings = [
    "@arbitrum/=node_modules/@arbitrum/",
    "@offchainlabs/=node_modules/@offchainlabs/",
    "@openzeppelin/=node_modules/@openzeppelin/",
    "ds-test/=lib/forge-std/lib/ds-test/src/",
    "eth-gas-reporter/=node_modules/eth-gas-reporter/",
    "forge-std/=lib/forge-std/src/",
    "hardhat/=node_modules/hardhat/",
    "solady/=node_modules/solady/src",
    "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "espresso-tee-contracts/=lib/nitro-contracts-v3/lib/espresso-tee-contracts/src/",
    "@automata-network/dcap-attestation=lib/nitro-contracts-v3/lib/espresso-tee-contracts/lib/automata-dcap-attestation",
    "@automata-network/on-chain-pccs=lib/nitro-contracts-v3/lib/espresso-tee-contracts/lib/automata-dcap-attestation/lib/automata-on-chain-pccs/src",
    "nitro-contracts=/lib/nitro-contracts/src",
    "nitro-contracts-v3=/lib/nitro-contracts-v3/src",
]
cache_path = 'cache_forge_v3'
solc_version = '0.8.25'
optimizer = true
optimizer_runs = 2000
via_ir = true
fs_permissions = [
    { access = "read", path = "node_modules/@offchainlabs/" },
    { access = "read", path = "node_modules/@arbitrum/" },
    { access = "read", path = "node_modules/@openzeppelin/" },
    { access = "read", path = "./migration/2.1.0" },
    { access = "read", path = "./migration/2.1.3" },
    { access = "read", path = "./migration/espresso-2.1.0/" },
    { access = "read", path = "./migration/espresso-2.1.3" },
    { access = "read", path = "./contracts/parent-chain/espresso-migration/" },
]
script = ''
evm_version = 'cancun'
